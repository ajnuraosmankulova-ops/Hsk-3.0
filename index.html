<script>(function(){var Q=[{"z": ["学而时习之，", "不亦说乎？"], "p": "Xué ér shí xí zhī, bú yì yuè hū?", "r": "Учиться и вовремя повторять изученное — разве это не радость?", "a": "Конфуций · «Лунь юй»"}, {"z": ["千里之行，", "始于足下。"], "p": "Qiān lǐ zhī xíng, shǐ yú zú xià.", "r": "Путь в тысячу ли начинается с первого шага.", "a": "Лао-цзы · «Дао дэ цзин»"}, {"z": ["三人行，", "必有我师焉。"], "p": "Sān rén xíng, bì yǒu wǒ shī yān.", "r": "Когда идут трое, среди них непременно найдётся мой учитель.", "a": "Конфуций · «Лунь юй»"}, {"z": ["温故而知新，", "可以为师矣。"], "p": "Wēn gù ér zhī xīn, kěyǐ wéi shī yǐ.", "r": "Повторяя старое, открываешь новое — такой человек может быть учителем.", "a": "Конфуций · «Лунь юй»"}, {"z": ["知之者不如好之者，", "好之者不如乐之者。"], "p": "Zhī zhī zhě bù rú hào zhī zhě, hào zhī zhě bù rú lè zhī zhě.", "r": "Знающий уступает любящему, а любящий уступает тому, кто находит в этом радость.", "a": "Конфуций · «Лунь юй»"}, {"z": ["不积跬步，", "无以至千里。"], "p": "Bù jī kuǐ bù, wú yǐ zhì qiān lǐ.", "r": "Не копя шаг за шагом, не дойти и за тысячу ли.", "a": "Сюнь-цзы · «Призыв к учению»"}, {"z": ["读万卷书，", "行万里路。"], "p": "Dú wàn juàn shū, xíng wàn lǐ lù.", "r": "Прочти десять тысяч свитков — пройди десять тысяч ли.", "a": "Народная мудрость"}, {"z": ["学无止境。"], "p": "Xué wú zhǐ jìng.", "r": "Учёбе нет предела.", "a": "Народная мудрость"}, {"z": ["活到老，", "学到老。"], "p": "Huó dào lǎo, xué dào lǎo.", "r": "Живи до старости — учись до старости.", "a": "Народная мудрость"}, {"z": ["书山有路勤为径，", "学海无涯苦作舟。"], "p": "Shū shān yǒu lù qín wéi jìng, xué hǎi wú yá kǔ zuò zhōu.", "r": "На горе книг есть дорога, и тропа на ней — усердие. У моря знаний нет берегов, и лодка в нём — труд.", "a": "Народная мудрость"}, {"z": ["学而不思则罔，", "思而不学则殆。"], "p": "Xué ér bù sī zé wǎng, sī ér bù xué zé dài.", "r": "Учение без размышления бесполезно, а размышление без учения опасно.", "a": "Конфуций · «Лунь юй»"}, {"z": ["知之为知之，", "不知为不知，", "是知也。"], "p": "Zhī zhī wéi zhī zhī, bù zhī wéi bù zhī, shì zhì yě.", "r": "Знать, что знаешь, и не знать, чего не знаешь, — вот это и есть знание.", "a": "Конфуций · «Лунь юй»"}, {"z": ["敏而好学，", "不耻下问。"], "p": "Mǐn ér hào xué, bù chǐ xià wèn.", "r": "Кто способен и любит учиться, не стыдится спрашивать у нижестоящих.", "a": "Конфуций · «Лунь юй»"}, {"z": ["欲速则不达。"], "p": "Yù sù zé bù dá.", "r": "Поспешишь — цели не достигнешь.", "a": "Конфуций · «Лунь юй»"}, {"z": ["己所不欲，", "勿施于人。"], "p": "Jǐ suǒ bú yù, wù shī yú rén.", "r": "Чего не желаешь себе, того не делай другим.", "a": "Конфуций · «Лунь юй»"}, {"z": ["君子坦荡荡，", "小人长戚戚。"], "p": "Jūnzǐ tǎn dàngdàng, xiǎorén cháng qīqī.", "r": "Благородный муж спокоен и открыт, ничтожный человек вечно тревожится.", "a": "Конфуций · «Лунь юй»"}, {"z": ["三思而后行。"], "p": "Sān sī ér hòu xíng.", "r": "Трижды подумай, а потом действуй.", "a": "Конфуций · «Лунь юй»"}, {"z": ["上善若水。"], "p": "Shàng shàn ruò shuǐ.", "r": "Высшее благо подобно воде.", "a": "Лао-цзы · «Дао дэ цзин»"}, {"z": ["知人者智，", "自知者明。"], "p": "Zhī rén zhě zhì, zì zhī zhě míng.", "r": "Кто знает других — умён, кто знает себя — просветлён.", "a": "Лао-цзы · «Дао дэ цзин»"}, {"z": ["胜人者有力，", "自胜者强。"], "p": "Shèng rén zhě yǒu lì, zì shèng zhě qiáng.", "r": "Побеждающий других силён, побеждающий себя — могуч.", "a": "Лао-цзы · «Дао дэ цзин»"}, {"z": ["天行健，", "君子以自强不息。"], "p": "Tiān xíng jiàn, jūnzǐ yǐ zì qiáng bù xī.", "r": "Движение Неба неустанно — так и благородный муж непрестанно совершенствует себя.", "a": "«И цзин»"}, {"z": ["工欲善其事，", "必先利其器。"], "p": "Gōng yù shàn qí shì, bì xiān lì qí qì.", "r": "Мастер, желающий хорошо сделать дело, сперва точит свои орудия.", "a": "Конфуций · «Лунь юй»"}, {"z": ["有志者，", "事竟成。"], "p": "Yǒu zhì zhě, shì jìng chéng.", "r": "У кого есть воля, у того дело в конце концов получится.", "a": "Народная мудрость"}, {"z": ["失败是成功之母。"], "p": "Shībài shì chénggōng zhī mǔ.", "r": "Неудача — мать успеха.", "a": "Народная мудрость"}, {"z": ["百闻不如一见。"], "p": "Bǎi wén bù rú yí jiàn.", "r": "Сто раз услышать — не то же, что один раз увидеть.", "a": "Народная мудрость"}, {"z": ["授人以鱼，", "不如授人以渔。"], "p": "Shòu rén yǐ yú, bù rú shòu rén yǐ yú.", "r": "Дать человеку рыбу — хуже, чем научить его ловить рыбу.", "a": "Народная мудрость"}, {"z": ["一寸光阴一寸金，", "寸金难买寸光阴。"], "p": "Yí cùn guāngyīn yí cùn jīn, cùn jīn nán mǎi cùn guāngyīn.", "r": "Миг времени — что кусочек золота, но золотом мига не купить.", "a": "Народная мудрость"}, {"z": ["宝剑锋从磨砺出，", "梅花香自苦寒来。"], "p": "Bǎojiàn fēng cóng mólì chū, méihuā xiāng zì kǔhán lái.", "r": "Остриё меча рождается в шлифовке, аромат сливы — из лютого холода.", "a": "Народная мудрость"}, {"z": ["业精于勤，", "荒于嬉。"], "p": "Yè jīng yú qín, huāng yú xī.", "r": "Мастерство рождается в усердии и гибнет в забавах.", "a": "Хань Юй"}, {"z": ["读书破万卷，", "下笔如有神。"], "p": "Dú shū pò wàn juàn, xià bǐ rú yǒu shén.", "r": "Прочтёшь десять тысяч свитков — и перо запишет словно по наитию.", "a": "Ду Фу"}, {"z": ["纸上得来终觉浅，", "绝知此事要躬行。"], "p": "Zhǐ shàng dé lái zhōng jué qiǎn, jué zhī cǐ shì yào gōng xíng.", "r": "Знание из книг в конце концов поверхностно; чтобы постичь дело по-настоящему, надо делать самому.", "a": "Лу Ю"}, {"z": ["海内存知己，", "天涯若比邻。"], "p": "Hǎinèi cún zhījǐ, tiānyá ruò bǐlín.", "r": "Пока на свете есть близкий друг, даже край света — как соседний дом.", "a": "Ван Бо"}, {"z": ["老师：为什么迟到？", "学生：路牌写着：", "“学校，慢行”。"], "p": "Lǎoshī: Wèishénme chídào? Xuésheng: Lùpái xiězhe: “Xuéxiào, màn xíng.”", "r": "Учитель: «Почему опоздал?» Ученик: «На дорожном знаке написано: „Школа, двигайтесь медленно“».", "a": "Шутка", "k": "Шутка"}, {"z": ["汉语不难，", "就是汉字", "多了一点。"], "p": "Hànyǔ bù nán, jiùshì hànzì duō le yìdiǎn.", "r": "Китайский не сложный — просто иероглифов чуть-чуть многовато.", "a": "Шутка", "k": "Шутка"}, {"z": ["我不是不想学习，", "是学习不想我。"], "p": "Wǒ bú shì bù xiǎng xuéxí, shì xuéxí bù xiǎng wǒ.", "r": "Это не я не хочу учиться — это учёба не хочет меня.", "a": "Шутка", "k": "Шутка"}, {"z": ["一声妈，二声麻，", "三声马，四声骂。"], "p": "Yī shēng mā, èr shēng má, sān shēng mǎ, sì shēng mà.", "r": "Первый тон — мама, второй — конопля, третий — лошадь, четвёртый — ругать.", "a": "Шутка про тоны", "k": "Шутка"}, {"z": ["今天不想学，", "明天一定学。"], "p": "Jīntiān bù xiǎng xué, míngtiān yídìng xué.", "r": "Сегодня не хочу учиться, завтра обязательно буду.", "a": "Вечный девиз", "k": "Шутка"}, {"z": ["我想减肥，", "但火锅说不行。"], "p": "Wǒ xiǎng jiǎnféi, dàn huǒguō shuō bù xíng.", "r": "Я хочу похудеть, но хого говорит: «Нельзя».", "a": "Шутка", "k": "Шутка"}, {"z": ["我的钱包，", "比脸还干净。"], "p": "Wǒ de qiánbāo, bǐ liǎn hái gānjìng.", "r": "Мой кошелёк чище, чем моё лицо.", "a": "Шутка", "k": "Шутка"}, {"z": ["考前：我都会！", "考时：这是什么？"], "p": "Kǎo qián: wǒ dōu huì! Kǎo shí: zhè shì shénme?", "r": "До экзамена: «Я всё знаю!» На экзамене: «А это вообще что?»", "a": "Шутка", "k": "Шутка"}, {"z": ["写汉字时：我会了！", "三天后：这是谁？"], "p": "Xiě hànzì shí: wǒ huì le! Sān tiān hòu: zhè shì shéi?", "r": "Пишешь иероглиф: «Я выучил!» Через три дня: «А это кто?»", "a": "Шутка", "k": "Шутка"}, {"z": ["躺平"], "p": "Tǎng píng", "r": "«Лечь плашмя»: сознательно отказаться от гонки за карьерой и достижениями.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["内卷"], "p": "Nèi juǎn", "r": "«Инволюция»: все выкладываются всё больше, а результат всё меньше.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["打工人，打工魂，", "打工都是人上人"], "p": "Dǎgōngrén, dǎgōnghún, dǎgōng dōu shì rén shàng rén.", "r": "Наёмный работник, душа работяги: все, кто работает, — люди высшего сорта. (Ироничный лозунг 2020 года.)", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["真香！"], "p": "Zhēn xiāng!", "r": "«Вот это вкусно!» — когда сначала отказывался, а потом сам не устоял.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["吃瓜群众"], "p": "Chīguā qúnzhòng", "r": "«Публика с дыней»: те, кто со стороны наблюдает за чужой драмой.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["佛系"], "p": "Fóxì", "r": "«Буддийский стиль»: спокойное «как получится, мне всё равно».", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["我太难了"], "p": "Wǒ tài nán le", "r": "«Мне так тяжело!» — шутливая жалоба на жизнь.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["学废了"], "p": "Xué fèi le", "r": "«Доучился до негодности»: голова уже не варит от учёбы.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["绝绝子"], "p": "Juéjuézi", "r": "Сленг: «просто бомба!» — когда что-то потрясающе хорошо.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["永远的神"], "p": "Yǒngyuǎn de shén", "r": "«Вечное божество» — лучше всех, легенда. Сокращённо пишут YYDS (по пиньиню).", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["听君一席话，", "胜读十年书"], "p": "Tīng jūn yì xí huà, shèng dú shí nián shū.", "r": "«Ваша речь лучше десяти лет чтения». Старая фраза, которой теперь с иронией «хвалят» очевидный совет.", "a": "Мем · интернет-сленг", "k": "Мем"}, {"z": ["加油！"], "p": "Jiāyóu!", "r": "«Давай! Вперёд!» — главное слово поддержки в китайском. Буквально: «добавь масла».", "a": "Мотивация", "k": "Мотивация"}, {"z": ["每天进步", "一点点。"], "p": "Měitiān jìnbù yìdiǎndiǎn.", "r": "Каждый день — понемногу лучше.", "a": "Мотивация", "k": "Мотивация"}, {"z": ["不怕慢，", "只怕站。"], "p": "Bú pà màn, zhǐ pà zhàn.", "r": "Не страшно идти медленно — страшно стоять на месте.", "a": "Пословица", "k": "Мотивация"}, {"z": ["坚持就是胜利。"], "p": "Jiānchí jiùshì shènglì.", "r": "Упорство — это и есть победа.", "a": "Пословица", "k": "Мотивация"}, {"z": ["今天的努力，", "是明天的实力。"], "p": "Jīntiān de nǔlì, shì míngtiān de shílì.", "r": "Сегодняшний труд — завтрашняя сила.", "a": "Мотивация", "k": "Мотивация"}, {"z": ["万事开头难。"], "p": "Wànshì kāitóu nán.", "r": "Всякое начало трудно.", "a": "Пословица", "k": "Мотивация"}, {"z": ["慢慢来，", "比较快。"], "p": "Mànmàn lái, bǐjiào kuài.", "r": "Не спеши — так выйдет быстрее.", "a": "Пословица", "k": "Мотивация"}, {"z": ["你已经学了", "这么多，别放弃！"], "p": "Nǐ yǐjīng xué le zhème duō, bié fàngqì!", "r": "Ты уже выучил столько — не сдавайся!", "a": "Мотивация", "k": "Мотивация"}, {"z": ["一天五个词，", "一年近两千个。"], "p": "Yì tiān wǔ ge cí, yì nián jìn liǎng qiān ge.", "r": "Пять слов в день — почти две тысячи слов за год.", "a": "Арифметика мотивации", "k": "Мотивация"}];var k=0;try{k=+localStorage.getItem("qtLast");if(isNaN(k))k=0}catch(e){}

{t:"北京的第一个月",r:"Первый месяц в Пекине",l:"HSK 3–4",s:[
["我/wǒ 叫/jiào 小林/xiǎolín， 是/shì 一/yī 个/gè 留学生/liúxuéshēng。 今年/jīnnián 九/jiǔ 月/yuè， 我/wǒ 来/lái 到/dào 北京/Běijīng 学习/xuéxí 汉语/Hànyǔ。 第/dì 一/yī 天/tiān 上课/shàngkè， 我/wǒ 很/hěn 紧张/jǐnzhāng。 老师/lǎoshī 让/ràng 我们/wǒmen 自/zì 我/wǒ 介绍/jièshào， 我/wǒ 说/shuō 得/de 不/bù 太/tài 好/hǎo， 但是/dànshì 同学/tóngxué 们/men 都/dōu 对/duì 我/wǒ 笑/xiào 了/le 笑/xiào。 坐/zuò 在/zài 我/wǒ 旁边/pángbiān 的/de 女孩/nǚhái 叫/jiào 王梅/wángméi， 她/tā 说/shuō， 欢迎/huānyíng 你/nǐ！ 以后/yǐhòu 有/yǒu 问题/wèntí， 可以/kěyǐ 问/wèn 我/wǒ。", "Меня зовут Сяо Линь, я иностранный студент. В сентябре я приехал в Пекин учить китайский. В первый день занятий я очень волновался. Преподаватель попросил нас представиться; я сказал не очень хорошо, но одногруппники мне улыбнулись. Девушку рядом звали Ван Мэй, она сказала: «Добро пожаловать! Если будут вопросы, спрашивай меня»."],
["周末/zhōumò， 我/wǒ 想/xiǎng 去/qù 长城/Chángchéng。 我/wǒ 一/yī 个/gè 人/rén 坐/zuò 地铁/dìtiě， 可是/kěshì 换/huàn 车/chē 的/de 时候/shíhou 走/zǒu 错/cuò 了/le 方向/fāngxiàng。 手机/shǒujī 没/méi 电/diàn 了/le， 我/wǒ 也/yě 不/bù 认识/rènshi 路/lù。 我/wǒ 很/hěn 着急/zháojí， 只好/zhǐhǎo 问/wèn 一/yī 位/wèi 老人/lǎorén。 老人/lǎorén 很/hěn 热/rè 心/xīn， 他/tā 不但/búdàn 告诉/gàosu 我/wǒ 怎么/zěnme 走/zǒu， 还/hái 陪/péi 我/wǒ 走/zǒu 到/dào 了/le 地铁/dìtiě 站/zhàn。", "В выходные я захотел поехать на Великую стену. Я сел в метро один, но при пересадке пошёл не в ту сторону. Телефон разрядился, дороги я не знал. Я сильно заволновался и вынужден был спросить пожилого человека. Он оказался очень отзывчивым: не только объяснил дорогу, но и проводил меня до станции."],
["终于/zhōngyú， 我/wǒ 到/dào 了/le 长城/Chángchéng。 天气/tiānqì 很/hěn 好/hǎo， 风景/fēngjǐng 非常/fēicháng 美/měi。 我/wǒ 爬/pá 了/le 两/liǎng 个/gè 小时/xiǎoshí， 累/lèi 得/de 满/mǎn 头/tóu 大/dà 汗/hàn， 可是/kěshì 站/zhàn 在/zài 山/shān 上/shàng 的/de 时候/shíhou， 我/wǒ 觉得/juéde 一切/yíqiè 都/dōu 值得/zhídé。 我/wǒ 给/gěi 妈妈/māma 打/dǎ 了/le 一/yī 个/gè 电话/diànhuà， 对/duì 她/tā 说/shuō， 我/wǒ 在/zài 长城/Chángchéng 上/shàng， 我/wǒ 很/hěn 好/hǎo。", "Наконец я добрался до Великой стены. Погода была хорошая, виды — прекрасные. Я поднимался два часа и весь вспотел от усталости, но, стоя на горе, почувствовал, что всё это того стоило. Я позвонил маме и сказал: «Я на Великой стене, у меня всё хорошо»."],
["星期/xīngqī 一/yī， 我/wǒ 把/bǎ 这/zhè 件/jiàn 事/shì 告诉/gàosu 了/le 王梅/wángméi。 她/tā 笑/xiào 着/zhe 说/shuō， 你/nǐ 应该/yīnggāi 请/qǐng 我/wǒ 吃/chī 饭/fàn， 因为/yīnwèi 是/shì 我/wǒ 教/jiāo 你/nǐ 坐/zuò 地铁/dìtiě 的/de！ 我们/wǒmen 一起/yìqǐ 去/qù 了/le 学校/xuéxiào 旁边/pángbiān 的/de 饭馆/fànguǎn。 我/wǒ 点/diǎn 了/le 饺子/jiǎozi， 她/tā 点/diǎn 了/le 面条/miàntiáo。 吃/chī 饭/fàn 的/de 时候/shíhou， 我们/wǒmen 聊/liáo 了/le 很/hěn 多/duō， 我/wǒ 发现/fāxiàn 我们/wǒmen 有/yǒu 很/hěn 多/duō 共同/gòngtóng 的/de 爱好/àihào。", "В понедельник я рассказал об этом Ван Мэй. Она с улыбкой сказала: «Ты должен угостить меня обедом — это же я научила тебя ездить на метро!» Мы вместе пошли в ресторанчик рядом с университетом. Я заказал пельмени, она — лапшу. За едой мы много болтали, и я обнаружил, что у нас много общих увлечений."],
["一/yī 个/gè 月/yuè 过去/guòqù 了/le， 我/wǒ 的/de 汉语/Hànyǔ 进/jìn 步/bù 了/le 很/hěn 多/duō。 现在/xiànzài 我/wǒ 可以/kěyǐ 用/yòng 汉语/Hànyǔ 买/mǎi 东西/dōngxi、 问路/wènlù， 还/hái 能/néng 和/hé 朋友/péngyou 聊天/liáotiān。 老师/lǎoshī 说/shuō， 只要/zhǐyào 每/měi 天/tiān 坚持/jiānchí 学习/xuéxí， 就/jiù 一定/yídìng 会/huì 越/yuè 来/lái 越/yuè 好/hǎo。 我/wǒ 相信/xiāngxìn 她/tā 说/shuō 得/de 对/duì。 北京/Běijīng， 我/wǒ 喜欢/xǐhuan 你/nǐ！", "Прошёл месяц, и мой китайский заметно улучшился. Теперь я могу на китайском делать покупки, спрашивать дорогу и болтать с друзьями. Преподаватель сказала: если заниматься каждый день, будет всё лучше и лучше. Я верю, что она права. Пекин, ты мне нравится!"]]},
{t:"给奶奶的礼物",r:"Подарок для бабушки",l:"HSK 3–4",s:[
["下/xià 个/gè 月/yuè 是/shì 奶奶/nǎinai 七/qī 十/shí 岁/suì 的/de 生日/shēngrì。 全/quán 家人/jiārén 都/dōu 想/xiǎng 给/gěi 她/tā 买/mǎi 一/yī 个/gè 特别/tèbié 的/de 礼物/lǐwù， 可是/kěshì 不/bù 知道/zhīdào 买/mǎi 什么/shénme 好/hǎo。 爸爸/bàba 说/shuō 买/mǎi 衣服/yīfu， 妈妈/māma 说/shuō 买/mǎi 手机/shǒujī， 我/wǒ 觉得/juéde 她/tā 可能/kěnéng 更/gèng 需要/xūyào 一/yī 个/gè 新/xīn 的/de 茶/chá 杯/bēi。", "В следующем месяце бабушке исполняется семьдесят. Вся семья хотела купить ей особенный подарок, но не знала, какой именно. Папа предложил одежду, мама — телефон, а я решил, что ей, возможно, нужнее новая чашка для чая."],
["星期/xīngqī 六/liù， 我/wǒ 和/hé 妹妹/mèimei 去/qù 了/le 一/yī 家/jiā 大/dà 商店/shāngdiàn。 里面/lǐmiàn 的/de 东西/dōngxi 又/yòu 多/duō 又/yòu 贵/guì， 我们/wǒmen 看/kàn 了/le 很/hěn 久/jiǔ， 什么/shénme 也/yě 没/méi 买/mǎi。 妹妹/mèimei 有点/yǒudiǎn 累/lèi 了/le， 她/tā 说/shuō， 我们/wǒmen 先/xiān 休息/xiūxi 一下/yíxià， 喝/hē 杯/bēi 咖啡/kāfēi 吧/ba。", "В субботу мы с сестрой пошли в большой магазин. Вещей там было много, и все дорогие; мы долго смотрели, но ничего не купили. Сестра немного устала и сказала: «Давай сначала отдохнём и выпьем кофе»."],
["坐/zuò 在/zài 咖啡馆/kāfēiguǎn 里/lǐ， 我/wǒ 突然/tūrán 想/xiǎng 起/qǐ 奶奶/nǎinai 以前/yǐqián 总是/zǒngshì 说/shuō， 她/tā 年轻/niánqīng 时/shí 有/yǒu 一/yī 张/zhāng 全/quán 家/jiā 的/de 照片/zhàopiàn， 可是/kěshì 后来/hòulái 不/bù 小心/xiǎoxīn 丢/diū 了/le。 我/wǒ 对/duì 妹妹/mèimei 说/shuō， 我们/wǒmen 可以/kěyǐ 把/bǎ 旧/jiù 照片/zhàopiàn 找/zhǎo 出来/chūlái， 做/zuò 一/yī 本/běn 相册/xiàngcè！", "Сидя в кафе, я вдруг вспомнил, что бабушка часто говорила: в молодости у неё была семейная фотография, но потом она случайно потерялась. Я сказал сестре: «Давай найдём старые фото и сделаем альбом!»"],
["接/jiē 下来/xiàlai 的/de 一/yī 个/gè 星期/xīngqī， 我们/wǒmen 每/měi 天/tiān 晚上/wǎnshang 都/dōu 在/zài 整理/zhěnglǐ 照片/zhàopiàn。 爸爸/bàba 给/gěi 我们/wǒmen 讲/jiǎng 了/le 很/hěn 多/duō 过去/guòqù 的/de 故事/gùshi， 大家/dàjiā 一边/yìbiān 看/kàn 一边/yìbiān 笑/xiào。 妹妹/mèimei 还/hái 在/zài 每/měi 一/yī 页/yè 写/xiě 了/le 一/yī 句/jù 话/huà。 虽然/suīrán 很/hěn 麻烦/máfan， 但是/dànshì 我们/wǒmen 都/dōu 觉得/juéde 很/hěn 有意思/yǒuyìsi。", "Всю следующую неделю мы каждый вечер разбирали фотографии. Папа рассказывал нам много историй из прошлого, все смотрели и смеялись. Сестра ещё написала на каждой странице по фразе. Хотя было хлопотно, нам всем было очень интересно."],
["生日/shēngrì 那/nà 天/tiān， 奶奶/nǎinai 打开/dǎkāi 相册/xiàngcè， 看/kàn 了/le 很/hěn 长/cháng 时间/shíjiān， 没有/méiyǒu 说话/shuōhuà。 后来/hòulái 她/tā 笑/xiào 了/le， 眼睛/yǎnjing 里/lǐ 有/yǒu 眼泪/yǎnlèi。 她/tā 说/shuō， 这/zhè 是/shì 我/wǒ 收到/shōudào 的/de 最好/zuìhǎo 的/de 礼物/lǐwù。 那/nà 一/yī 刻/kè， 我/wǒ 明白/míngbai 了/le， 礼物/lǐwù 不/bù 一定/yídìng 要/yào 贵/guì， 重要/zhòngyào 的/de 是/shì 心意/xīnyì。", "В день рождения бабушка открыла альбом и долго смотрела, ничего не говоря. Потом улыбнулась, а в глазах блеснули слёзы. Она сказала: «Это лучший подарок, который мне дарили». В тот момент я понял: подарок не обязательно должен быть дорогим, главное — внимание и забота."]]},
{t:"去上海",r:"Поездка в Шанхай",l:"HSK 3–4",s:[
["我/wǒ 想/xiǎng 去/qù 上/shàng 海/hǎi 看/kàn 朋友/péngyou， 所以/suǒyǐ 在/zài 网上/wǎngshàng 买/mǎi 了/le 一/yī 张/zhāng 火车/huǒchē 票/piào。 动车/dòngchē 从/cóng 北京/Běijīng 到/dào 上/shàng 海/hǎi 只要/zhǐyào 四/sì 个/gè 半/bàn 小时/xiǎoshí， 比/bǐ 飞机/fēijī 方便/fāngbiàn 多/duō 了/le。 我/wǒ 选/xuǎn 了/le 靠窗/kàochuāng 的/de 座位/zuòwèi， 因为/yīnwèi 我/wǒ 喜欢/xǐhuan 看/kàn 风景/fēngjǐng。", "Я хотел навестить друга в Шанхае и купил в интернете билет на поезд. Скоростной поезд из Пекина в Шанхай идёт всего четыре с половиной часа, это намного удобнее самолёта. Я выбрал место у окна, потому что люблю смотреть на пейзажи."],
["出发/chūfā 那/nà 天/tiān， 我/wǒ 早/zǎo 早/zǎo 地/de 来/lái 到/dào 火车/huǒchē 站/zhàn。 车站/chēzhàn 里/lǐ 人/rén 很/hěn 多/duō， 我/wǒ 先/xiān 过/guò 了/le 安检/ānjiǎn， 然后/ránhòu 找/zhǎo 到/dào 了/le 站/zhàn 台/tái。 火车/huǒchē 准时/zhǔnshí 开/kāi 了/le， 我/wǒ 的/de 心里/xīnlǐ 又/yòu 高兴/gāoxìng 又/yòu 激动/jīdòng。", "В день отправления я рано приехал на вокзал. Людей было много; я прошёл досмотр и нашёл платформу. Поезд отправился точно по расписанию, и мне было и радостно, и волнительно."],
["坐/zuò 在/zài 我/wǒ 旁边/pángbiān 的/de 是/shì 一/yī 位/wèi 老/lǎo 先生/xiānsheng。 他/tā 告诉/gàosu 我/wǒ， 他/tā 每/měi 年/nián 都/dōu 去/qù 上/shàng 海/hǎi 看/kàn 孙子/sūnzi。 我们/wǒmen 聊/liáo 了/le 很/hěn 多/duō， 他/tā 还/hái 给/gěi 我/wǒ 讲/jiǎng 了/le 几/jǐ 个/gè 有意思/yǒuyìsi 的/de 故事/gùshi。 时间/shíjiān 过/guò 得/de 真/zhēn 快/kuài。", "Рядом со мной сидел пожилой господин. Он рассказал, что каждый год ездит в Шанхай к внуку. Мы много разговаривали, и он поведал мне несколько интересных историй. Время пролетело быстро."],
["下/xià 车/chē 以后/yǐhòu， 我/wǒ 看见/kànjiàn 朋友/péngyou 正在/zhèngzài 出口/chūkǒu 等/děng 我/wǒ。 他/tā 笑/xiào 着/zhe 对/duì 我/wǒ 说/shuō， 欢迎/huānyíng 来/lái 到/dào 上/shàng 海/hǎi！ 我们/wǒmen 先/xiān 把/bǎ 行李/xíngli 放/fàng 在/zài 他/tā 家/jiā， 然后/ránhòu 出去/chūqù 吃/chī 了/le 晚饭/wǎnfàn。 上/shàng 海/hǎi 菜/cài 有点儿/yǒudiǎnr 甜/tián， 不过/bùguò 很/hěn 好吃/hǎochī。", "Выйдя из поезда, я увидел друга, ожидавшего меня у выхода. Он с улыбкой сказал: «Добро пожаловать в Шанхай!» Мы оставили багаж у него дома и пошли ужинать. Шанхайская кухня немного сладковатая, но очень вкусная."],
["三/sān 天/tiān 很/hěn 快/kuài 就/jiù 过去/guòqù 了/le。 回/huí 北京/Běijīng 的/de 路上/lùshang， 我/wǒ 一直/yìzhí 在/zài 想/xiǎng， 旅行/lǚxíng 不但/búdàn 让/ràng 我/wǒ 看/kàn 到/dào 了/le 新/xīn 的/de 地方/dìfang， 还/hái 让/ràng 我/wǒ 更/gèng 了解/liǎojiě 朋友/péngyou。 下/xià 次/cì， 我/wǒ 一定/yídìng 还/hái 要/yào 再/zài 来/lái。", "Три дня быстро пролетели. По дороге обратно в Пекин я всё думал, что путешествие не только показало мне новые места, но и помогло лучше узнать друга. В следующий раз я обязательно приеду снова."]]},
{t:"第一天上班",r:"Первый день на работе",l:"HSK 3–4",s:[
["上/shàng 个/gè 星期/xīngqī， 我/wǒ 通过/tōngguò 了/le 一/yī 家/jiā 公司/gōngsī 的/de 面试/miànshì。 经理/jīnglǐ 说/shuō， 我/wǒ 下/xià 周/zhōu 一/yī 就/jiù 可以/kěyǐ 开始/kāishǐ 上班/shàngbān。 我/wǒ 高兴/gāoxìng 极/jí 了/le， 马上/mǎshàng 给/gěi 家人/jiārén 打/dǎ 了/le 电话/diànhuà。 晚上/wǎnshang， 我/wǒ 还/hái 特意/tèyì 准备/zhǔnbèi 好/hǎo 了/le 星期/xīngqī 一/yī 要/yào 穿/chuān 的/de 衣服/yīfu。", "На прошлой неделе я прошёл собеседование в одной компании. Менеджер сказал, что со следующего понедельника я могу приступать к работе. Я безумно обрадовался и сразу позвонил родным. Вечером я специально приготовил одежду на понедельник."],
["星期/xīngqī 一/yī 早上/zǎoshang， 我/wǒ 提前/tíqián 半/bàn 个/gè 小时/xiǎoshí 到/dào 了/le 公司/gōngsī。 同事/tóngshì 们/men 都/dōu 很/hěn 热情/rèqíng， 他们/tāmen 带/dài 我/wǒ 参观/cānguān 了/le 办公室/bàngōngshì， 还/hái 介绍/jièshào 我/wǒ 认识/rènshi 了/le 不同/bùtóng 部门/bùmén 的/de 人/rén。 我/wǒ 一下/yíxià 子/zi 记/jì 不/bù 住/zhù 这么/zhème 多/duō 名字/míngzi， 觉得/juéde 有点儿/yǒudiǎnr 不好意思/bùhǎoyìsi。", "В понедельник утром я пришёл в компанию на полчаса раньше. Коллеги были очень приветливы: показали мне офис и познакомили с людьми из разных отделов. Запомнить столько имён сразу я не смог и немного смутился."],
["中午/zhōngwǔ， 经理/jīnglǐ 让/ràng 我/wǒ 整理/zhěnglǐ 一/yī 份/fèn 文件/wénjiàn。 我/wǒ 很/hěn 认真/rènzhēn 地/de 做/zuò 了/le， 可是/kěshì 发/fā 给/gěi 他/tā 以后/yǐhòu， 才/cái 发现/fāxiàn 有/yǒu 一/yī 个/gè 严重/yánzhòng 的/de 错误/cuòwù。 我/wǒ 吓了一跳/xiàleyítiào， 赶紧/gǎnjǐn 去/qù 向/xiàng 他/tā 道歉/dàoqiàn。", "В обед менеджер попросил меня оформить документ. Я сделал это очень старательно, но после отправки обнаружил серьёзную ошибку. Я испугался и поспешил извиниться перед ним."],
["经理/jīnglǐ 没有/méiyǒu 生气/shēngqì， 他/tā 笑/xiào 着/zhe 说/shuō， 每/měi 个/gè 人/rén 刚/gāng 开始/kāishǐ 工作/gōngzuò 的/de 时候/shíhou 都/dōu 会/huì 犯错误/fàncuòwù， 重要/zhòngyào 的/de 是/shì 以后/yǐhòu 不要/búyào 再/zài 犯/fàn。 他/tā 还/hái 帮/bāng 我/wǒ 改/gǎi 好/hǎo 了/le 文件/wénjiàn。 我/wǒ 心里/xīnlǐ 一下/yíxià 子/zi 轻松/qīngsōng 多/duō 了/le。", "Менеджер не рассердился. Он с улыбкой сказал, что каждый, начиная работать, делает ошибки, и важно не повторять их потом. Он ещё и помог мне исправить документ. На душе сразу стало намного легче."],
["下班/xiàbān 以后/yǐhòu， 同事/tóngshì 们/men 请/qǐng 我/wǒ 一起/yìqǐ 去/qù 吃/chī 晚饭/wǎnfàn。 大家/dàjiā 聊/liáo 着/zhe 天/tiān， 喝/hē 着/zhe 茶/chá， 气氛/qìfēn 很/hěn 轻松/qīngsōng。 回/huí 家/jiā 的/de 路上/lùshang， 我/wǒ 想/xiǎng， 虽然/suīrán 第/dì 一/yī 天/tiān 遇到/yùdào 了/le 问题/wèntí， 但是/dànshì 我/wǒ 已经/yǐjīng 爱/ài 上/shàng 了/le 这/zhè 份/fèn 工作/gōngzuò。", "После работы коллеги пригласили меня поужинать вместе. Все болтали и пили чай, атмосфера была расслабленной. По дороге домой я подумал: хотя в первый день и возникли трудности, мне уже нравится эта работа."]]},
{t:"我的家",r:"Моя семья",l:"HSK 1",s:[
["这/zhè 是/shì 我/wǒ 的/de 家/jiā。 我/wǒ 家/jiā 有/yǒu 五/wǔ 个/gè 人/rén， 爸爸/bàba、 妈妈/māma、 哥哥/gēge、 妹妹/mèimei 和/hé 我/wǒ。 我们/wǒmen 住/zhù 在/zài 北京/Běijīng。", "Это мой дом. В моей семье пять человек: папа, мама, старший брат, младшая сестра и я. Мы живём в Пекине."],
["我/wǒ 爸爸/bàba 是/shì 医生/yīshēng。 他/tā 在/zài 医院/yīyuàn 工作/gōngzuò。 他/tā 很/hěn 忙/máng， 可是/kěshì 他/tā 很/hěn 爱/ài 我们/wǒmen。", "Мой папа — врач. Он работает в больнице. Он очень занят, но очень любит нас."],
["我/wǒ 妈妈/māma 是/shì 老师/lǎoshī。 她/tā 在/zài 学校/xuéxiào 工作/gōngzuò。 她/tā 喜欢/xǐhuan 看/kàn 书/shū， 也/yě 喜欢/xǐhuan 做饭/zuòfàn。", "Моя мама — учитель. Она работает в школе. Она любит читать и готовить."],
["我/wǒ 哥哥/gēge 今年/jīnnián 二/èr 十/shí 岁/suì。 他/tā 是/shì 大学生/dàxuéshēng。 他/tā 会/huì 说/shuō 汉语/Hànyǔ， 也/yě 会/huì 说/shuō 英语/Yīngyǔ。", "Моему старшему брату в этом году двадцать. Он студент университета. Он говорит по-китайски и по-английски."],
["我/wǒ 妹妹/mèimei 八/bā 岁/suì， 她/tā 很/hěn 可爱/kěài。 我们/wǒmen 家/jiā 有/yǒu 一/yī 只/zhī 小/xiǎo 猫/māo， 它/tā 叫/jiào 小白/xiǎobái。 我/wǒ 爱/ài 我/wǒ 的/de 家/jiā。", "Младшей сестре восемь лет, она очень милая. У нас дома есть котёнок, его зовут Сяобай. Я люблю свой дом."]]},
{t:"在饭馆",r:"В ресторане",l:"HSK 1",s:[
["今天/jīntiān 是/shì 星期/xīngqī 六/liù。 中午/zhōngwǔ， 我/wǒ 和/hé 朋友/péngyou 去/qù 饭馆/fànguǎn 吃/chī 饭/fàn。 这/zhè 家/jiā 饭馆/fànguǎn 不/bù 大/dà， 可是/kěshì 人/rén 很/hěn 多/duō。", "Сегодня суббота. В полдень мы с другом пошли обедать в ресторанчик. Ресторан небольшой, но людей много."],
["服务员/fúwùyuán 说/shuō， 你们/nǐmen 好/hǎo， 请/qǐng 坐/zuò。 我们/wǒmen 坐/zuò 下来/xiàlai， 看/kàn 了/le 看/kàn 菜/cài。", "Официант сказал: «Здравствуйте, присаживайтесь». Мы сели и посмотрели меню."],
["我/wǒ 要/yào 一/yī 碗/wǎn 面条/miàntiáo， 朋友/péngyou 要/yào 一/yī 个/gè 米饭/mǐfàn 和/hé 两/liǎng 个/gè 菜/cài。 我们/wǒmen 还/hái 要/yào 两/liǎng 杯/bēi 茶/chá。", "Я заказал миску лапши, друг — рис и два блюда. Ещё мы заказали две чашки чая."],
["菜/cài 很/hěn 好吃/hǎochī， 我们/wǒmen 吃/chī 得/de 很/hěn 高兴/gāoxìng。 朋友/péngyou 说/shuō， 这个/zhège 菜/cài 太/tài 好吃/hǎochī 了/le！ 我/wǒ 说/shuō， 我/wǒ 也/yě 喜欢/xǐhuan。", "Еда была очень вкусной, мы ели с удовольствием. Друг сказал: «Это блюдо просто объедение!» Я ответил: «Мне тоже нравится»."],
["吃/chī 完/wán 饭/fàn， 我/wǒ 问/wèn 服务员/fúwùyuán， 一共/yígòng 多少/duōshao 钱/qián？ 他/tā 说/shuō， 一共/yígòng 四/sì 十/shí 八/bā 块/kuài。 我/wǒ 给/gěi 了/le 他/tā 五/wǔ 十/shí 块/kuài， 他/tā 又/yòu 给/gěi 了/le 我/wǒ 两/liǎng 块/kuài。 谢谢/xièxie， 再见/zàijiàn！", "Поев, я спросил официанта: «Сколько всего?» Он ответил: «Сорок восемь юаней». Я дал ему пятьдесят, он вернул мне два. «Спасибо, до свидания!»"]]},
{t:"怎么去学校",r:"Как я добираюсь до школы",l:"HSK 1–2",s:[

["下雨/xiàyǔ 的/de 时候/shíhou， 我/wǒ 坐/zuò 公共/gōnggòng 汽车/qìchē。 公共/gōnggòng 汽车/qìchē 站/zhàn 在/zài 我/wǒ 家/jiā 旁边/pángbiān。", "Когда идёт дождь, я еду на автобусе. Остановка рядом с моим домом."],
["周末/zhōumò 我/wǒ 常常/chángcháng 坐/zuò 地铁/dìtiě 去/qù 找/zhǎo 朋友/péngyou。 地铁/dìtiě 又/yòu 快/kuài 又/yòu 方便/fāngbiàn。", "По выходным я часто еду на метро к друзьям. Метро быстрое и удобное."],
["爸爸/bàba 有/yǒu 一/yī 辆/liàng 车/chē， 可是/kěshì 他/tā 说/shuō 上班/shàngbān 开车/kāichē 太/tài 慢/màn， 他/tā 也/yě 坐/zuò 地铁/dìtiě。", "У папы есть машина, но он говорит, что на работу на ней ехать слишком долго, и тоже ездит на метро."]]},
{t:"在商店",r:"В магазине",l:"HSK 1–2",s:[

["这/zhè 件/jiàn 衣服/yīfu 很/hěn 漂亮/piàoliang， 可是/kěshì 有点儿/yǒudiǎnr 贵/guì。 我/wǒ 问/wèn， 能/néng 便宜/piányi 一点儿/yìdiǎnr 吗/ma？", "Эта вещь очень красивая, но немного дорогая. Я спросил: «Можно подешевле?»"],

{t:"我的爱好",r:"Мои увлечения",l:"HSK 1–2",s:[

["我/wǒ 哥哥/gēge 喜欢/xǐhuan 踢/tī 足球/zúqiú。 每/měi 个/gè 星期/xīngqī 六/liù， 他/tā 都/dōu 去/qù 球场/qiúchǎng 玩/wán。", "Мой брат любит играть в футбол. Каждую субботу он идёт играть на поле."],
["我/wǒ 爸爸/bàba 喜欢/xǐhuan 看/kàn 书/shū， 妈妈/māma 喜欢/xǐhuan 做饭/zuòfàn。 我们/wǒmen 家/jiā 的/de 晚饭/wǎnfàn 总是/zǒngshì 很/hěn 好吃/hǎochī。", "Папа любит читать, мама — готовить. Ужин у нас дома всегда очень вкусный."],
["你/nǐ 的/de 爱好/àihào 是/shì 什么/shénme？ 我/wǒ 想/xiǎng 和/hé 你/nǐ 一起/yìqǐ 玩/wán。", "А какое у тебя увлечение? Я хочу вместе с тобой поиграть."]]},
{t:"我的学校",r:"Моя школа",l:"HSK 1–2",s:[
["我/wǒ 的/de 学校/xuéxiào 很/hěn 大/dà， 有/yǒu 很/hěn 多/duō 学生/xuésheng 和/hé 老师/lǎoshī。 学校/xuéxiào 里/lǐ 有/yǒu 很/hěn 多/duō 教室/jiàoshì。", "Моя школа большая, там много учеников и учителей. В школе много классов."],
["我们/wǒmen 早上/zǎoshang 八/bā 点/diǎn 上课/shàngkè， 中午/zhōngwǔ 十/shí 二/èr 点/diǎn 吃/chī 饭/fàn。", "Занятия начинаются в восемь утра, в двенадцать у нас обед."],
["我/wǒ 最/zuì 喜欢/xǐhuan 上/shàng 汉语/Hànyǔ 课/kè。 我们/wǒmen 的/de 汉语/Hànyǔ 老师/lǎoshī 很/hěn 好/hǎo， 她/tā 常常/chángcháng 对/duì 我们/wǒmen 笑/xiào。", "Больше всего я люблю уроки китайского. Наша учительница очень добрая и часто нам улыбается."],
["下午/xiàwǔ 四/sì 点/diǎn， 我们/wǒmen 放学/fàngxué 回/huí 家/jiā。 我/wǒ 在/zài 学校/xuéxiào 有/yǒu 很/hěn 多/duō 好/hǎo 朋友/péngyou。", "В четыре часа дня мы идём домой после уроков. В школе у меня много хороших друзей."]]},
{t:"四个季节",r:"Четыре времени года",l:"HSK 1–2",s:[

const $=i=>document.getElementById(i);
const LIB="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js",DATA="https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/";
const db=new Promise((res,rej)=>{const q=indexedDB.open("hskOff",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const tx=(m,f)=>db.then(d=>new Promise((res,rej)=>{const t=d.transaction("kv",m),o=f(t.objectStore("kv"));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)}));
const get=k=>tx("readonly",s=>s.get(k)).catch(()=>undefined),put=(k,v)=>tx("readwrite",s=>s.put(v,k)).catch(()=>{});
window.hwLoad=async()=>{try{let src=await get("lib");if(!src){const r=await fetch(LIB);if(!r.ok)return false;src=await r.text();put("lib",src)}
const t=document.createElement("script");t.textContent=src;document.head.appendChild(t);return !!window.HanziWriter}catch(e){return false}};
window.hwChar=(ch,ok,err)=>{get("c:"+ch).then(d=>{if(d){ok(d);return}return fetch(DATA+encodeURIComponent(ch)+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{put("c:"+ch,j);ok(j)})}).catch(()=>err())};
const chars=()=>{const s=new Set(),a=w=>[...w[0]].forEach(c=>{if(/[\u4e00-\u9fff]/.test(c))s.add(c)});D.forEach(a);U.s.forEach(x=>x.w.forEach(a));return[...s]};
let busy=false;
const lab=t=>{$("offb").textContent=t};
async function dl(){if(busy)return;busy=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
lab("⬇️ …");const okLib=await window.hwLoad();if(!okLib){busy=false;lab("⬇️ Офлайн");gl("Нет интернета — скачать не получилось");return}
const L=chars();let i=0,n=0,bad=0;
const worker=async()=>{while(i<L.length){const c=L[i++];try{if(!(await get("c:"+c))){const r=await fetch(DATA+encodeURIComponent(c)+".json");if(!r.ok)throw 0;await put("c:"+c,await r.json())}n++}catch(_){bad++;if(bad>40)return}lab("⬇️ "+Math.round((n+bad)/L.length*100)+"%")}};
await Promise.all([1,2,3,4,5,6].map(worker));busy=false;
if(bad>40||n<L.length*.9){lab("⬇️ Офлайн");gl("Скачано "+n+" из "+L.length+". Проверьте интернет и нажмите ещё раз")}
else{try{localStorage.setItem("hskOff","1")}catch(_){}lab("✓ Офлайн");gl("Готово: письмо работает без интернета ("+n+" знаков)")}}
$("ebtn").insertAdjacentHTML("afterend",' <button id="offb" title="Скачать письмо для работы без интернета">⬇️ Офлайн</button>');
try{if(localStorage.getItem("hskOff")==="1")lab("✓ Офлайн")}catch(_){}
$("offb").onclick=dl;
})();

/* ===== Статистика и серия дней ===== */
(function(){
const $=i=>document.getElementById(i);
const KEY="hskLog";let LOG={};try{LOG=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(_){}
const dk=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>dk(Date.now());
window.act=()=>{const d=today();LOG[d]=(LOG[d]||0)+1;try{localStorage.setItem(KEY,JSON.stringify(LOG))}catch(_){}};
function streaks(){let cur=0,t=Date.now();if(!LOG[dk(t)])t-=864e5;while(LOG[dk(t)]){cur++;t-=864e5}
const ks=Object.keys(LOG).filter(k=>LOG[k]>0).sort();let best=0,run=0,prev=null;
ks.forEach(k=>{const p=prev&&(Date.parse(k)-Date.parse(prev))/864e5;run=p===1?run+1:1;prev=k;if(run>best)best=run});return[cur,best]}
const bar=(a,b,c)=>'<div style="height:10px;border-radius:5px;background:var(--bd,#ddd);overflow:hidden;display:flex"><div style="width:'+(b?a/b*100:0)+'%;background:var(--gold,#b08a3e)"></div><div style="width:'+(b?c/b*100:0)+'%;background:#d63a3a88"></div></div>';
function render(){const[cur,best]=streaks(),tn=LOG[today()]||0;
let R={};try{R=JSON.parse(localStorage.getItem("hskR")||"{}")||{}}catch(_){}
const firm=Object.keys(R).filter(w=>R[w].s>=3).length;
let h='<div style="text-align:center;margin:6px 0"><div style="font-size:42px">🔥 '+cur+'</div><div class="gh">дней подряд · рекорд: '+best+' · сегодня отметок: '+tn+'</div></div>';
const days=[];for(let i=6;i>=0;i--){const t=Date.now()-i*864e5,c=LOG[dk(t)]||0;days.push([["вс","пн","вт","ср","чт","пт","сб"][new Date(t).getDay()],c])}
const mx=Math.max(1,...days.map(d=>d[1]));
h+='<div style="display:flex;gap:6px;align-items:flex-end;height:70px;margin:10px 0">'+days.map(d=>'<div style="flex:1;text-align:center"><div style="height:'+Math.round(d[1]/mx*48)+'px;min-height:2px;background:var(--gold,#b08a3e);border-radius:3px"></div><div class="gh" style="font-size:12px">'+d[0]+'</div></div>').join("")+'</div>';
let K=0,T=0;
[["HSK 1",L1],["HSK 2",L2],["HSK 3",L3],["HSK 4",N4]].forEach(([n,st])=>{let k=0,u=0;st.forEach(w=>{if(S[w]==="k")k++;else if(S[w]==="n")u++});K+=k;T+=st.size;
h+='<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>'+n+'</b><span class="gh">знаю '+k+' · повторить '+u+' · всего '+st.size+'</span></div>'+bar(k,st.size,u)+'</div>'});
h+='<p>Всего знаю: <b>'+K+'</b> из '+T+'<br><span class="gh">Надёжно (интервал 16 дней и больше): '+firm+'</span></p><p class="gh">Серия растёт, когда вы отмечаете слова «знаю» или «ещё раз» в ленте, упражнениях и повторении. Данные хранятся в браузере.</p>';
$("statbd").innerHTML=h}
document.body.insertAdjacentHTML("beforeend",'<div class="ov" id="statov" hidden><div class="ovh"><b class="ttl">📊 Статистика</b><button id="statx">✕</button></div><div class="ovb" id="statbd"></div></div>');
$("ebtn").insertAdjacentHTML("afterend",' <button id="statb" title="Статистика">📊</button>');
$("statb").onclick=()=>{render();$("statov").hidden=false};
$("statx").onclick=()=>{$("statov").hidden=true};
})();

/* ===== Резервная копия прогресса ===== */
(function(){
const $=i=>document.getElementById(i);
const SKIP=["hskOff","hskBk"];
const keys=()=>{const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("hsk")===0&&SKIP.indexOf(k)<0)a.push(k)}}catch(_){}return a};
const collect=()=>{const d={};keys().forEach(k=>{try{d[k]=localStorage.getItem(k)}catch(_){}});return JSON.stringify({app:"hsk",v:1,t:new Date().toISOString(),d})};
function merge(k,a,b){try{const x=a?JSON.parse(a):null,y=JSON.parse(b);
if(k==="hskS"||k==="hskR")return JSON.stringify(Object.assign({},x,y));
if(k==="hskBkS"){const o=Object.assign({},x);for(const t in y){if(!o[t]||((y[t]&&y[t].t)||0)>=((o[t]&&o[t].t)||0))o[t]=y[t]}return JSON.stringify(o)}
if(k==="hskLog"){const o=Object.assign({},x);for(const d in y)o[d]=Math.max(o[d]||0,y[d]);return JSON.stringify(o)}
if(k==="hskU"&&x&&Array.isArray(x.s)&&Array.isArray(y.s)){const seen=new Set(x.s.map(e=>JSON.stringify(e)));return JSON.stringify(Object.assign({},x,y,{s:x.s.concat(y.s.filter(e=>!seen.has(JSON.stringify(e))))}))}}catch(_){}
return b}
function apply(txt,replace){let o;try{o=JSON.parse(txt)}catch(_){return"Это не файл копии: не удалось прочитать"}
if(!o||o.app!=="hsk"||!o.d)return"Это не файл копии этого приложения";
const ks=Object.keys(o.d).filter(k=>k.indexOf("hsk")===0&&SKIP.indexOf(k)<0&&typeof o.d[k]==="string");
if(!ks.length)return"В файле нет данных";
try{if(replace)keys().forEach(k=>localStorage.removeItem(k));
ks.forEach(k=>{const cur=replace?null:localStorage.getItem(k);localStorage.setItem(k,cur?merge(k,cur,o.d[k]):o.d[k])})}catch(_){return"Не удалось сохранить (память браузера заполнена?)"}
return ks.length}
const stamp=()=>new Date().toISOString().slice(0,10);
async function exp(){const txt=collect(),name="hsk-progress-"+stamp()+".json";
try{const f=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});done();return}}catch(e){if(e&&e.name==="AbortError")return}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);done()}
function done(){try{localStorage.setItem("hskBk",String(Date.now()))}catch(_){}info();gl("Копия сохранена")}
function info(){let t="";try{const b=+localStorage.getItem("hskBk");t=b?"Последняя копия: "+new Date(b).toLocaleDateString():"Копий ещё не было"}catch(_){}
$("bkinfo").textContent=t+" · данных в приложении: "+keys().length+" блоков"}
function imp(txt){const r=apply(txt,$("bkrep").checked);if(typeof r==="number"){gl("Загружено блоков: "+r+". Перезапускаю…");setTimeout(()=>location.reload(),900)}else gl(r)}
document.body.insertAdjacentHTML("beforeend",'<div class="ov" id="bkov" hidden><div class="ovh"><b class="ttl">💾 Резервная копия</b><button id="bkx2">✕</button></div><div class="ovb"><p class="gh" id="bkinfo"></p><p>В копию входят статусы слов, повторения, серия дней, свои наборы и настройки. Скачанные для офлайна знаки в неё не входят.</p><div class="btns"><button class="main" id="bkexp">⬆️ Сохранить копию</button><button id="bkcp">📋 Скопировать текст</button></div><hr><p><b>Восстановить</b></p><div class="btns"><button id="bkfile">📂 Выбрать файл</button></div><input type="file" id="bkin" accept=".json,application/json,text/plain" hidden><textarea id="bktx" rows="4" style="width:100%;margin-top:8px" placeholder="Или вставьте сюда текст копии"></textarea><div class="btns"><button id="bkpaste">Загрузить из текста</button></div><label class="gh"><input type="checkbox" id="bkrep"> заменить всё (иначе объединить с текущим)</label></div></div>');
$("ebtn").insertAdjacentHTML("afterend",' <button id="bkb2" title="Резервная копия">💾</button>');
$("bkb2").onclick=()=>{info();$("bkov").hidden=false};
$("bkx2").onclick=()=>{$("bkov").hidden=true};
$("bkexp").onclick=exp;
$("bkcp").onclick=()=>{const t=collect();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>done()).catch(()=>{const x=$("bktx");x.value=t;x.select();gl("Скопируйте текст из поля вручную")})};
$("bkfile").onclick=()=>$("bkin").click();
$("bkin").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(String(r.result));r.readAsText(f);e.target.value=""};
$("bkpaste").onclick=()=>{const t=$("bktx").value.trim();if(!t){gl("Поле пустое");return}imp(t)};
try{const b=+localStorage.getItem("hskBk")||0,S0=JSON.parse(localStorage.getItem("hskS")||"{}");
if(Object.keys(S0).length>=20&&Date.now()-b>7*864e5)setTimeout(()=>gl("💾 Копия прогресса не делалась "+(b?"больше недели":"ни разу")+". Меню → 💾"),4000)}catch(_){}
window.hskBackup={collect,apply};
})();
